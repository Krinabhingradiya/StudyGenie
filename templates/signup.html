<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5ff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}

.signup-card{
    width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.icon{
    font-size:50px;
    text-align:center;
    margin-bottom:10px;
}

.signup-btn{
    width:100%;
    background:#4f46e5;
    border:none;
}

.signup-btn:hover{
    background:#4338ca;
}

.login-link{
    text-align:center;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="signup-card">

    <div class="icon">
        🎓
    </div>

    <h3 class="text-center mb-4">
        Create Account
    </h3>

    <form action="/signup" method="POST">

        <div class="mb-3">
            <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Full Name"
                required>
        </div>

        <div class="mb-3">
            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Email"
                required>
        </div>

        <div class="mb-3">
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Password"
                required>
        </div>

        <button
            type="submit"
            class="btn btn-primary signup-btn">
            Sign Up
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
