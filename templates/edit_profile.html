<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | StudyGenie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
            font-family:Segoe UI, sans-serif;
        }

        .profile-card{
            max-width:700px;
            margin:50px auto;
            background:#fff;
            border-radius:18px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .profile-header{
            text-align:center;
            margin-bottom:30px;
        }

        .avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#6c63ff;
            color:#fff;
            font-size:34px;
            font-weight:bold;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            margin-bottom:15px;
        }

        .btn-save{
            background:#6c63ff;
            color:white;
            border:none;
        }

        .btn-save:hover{
            background:#5848e5;
            color:white;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="profile-card">

        <div class="profile-header">

            <div class="avatar">
                {{ user_name[0]|upper }}
            </div>

            <h3>Edit Profile</h3>

            <p class="text-muted">
                Update your personal information
            </p>

        </div>

        <form method="post">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ user_name }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    name="email"
                    value="{{ user_email }}"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Role
                </label>

                <select
                    class="form-select"
                    name="role">

                    <option value="School Student"
    {% if user_role=="School Student" %}selected{% endif %}>
    School Student
    </option>

    <option value="College Student"
    {% if user_role=="College Student" %}selected{% endif %}>
    College Student
    </option>

    <option value="University Student"
    {% if user_role=="University Student" %}selected{% endif %}>
    University Student
    </option>

    <option value="Competitive Exam Aspirant"
    {% if user_role=="Competitive Exam Aspirant" %}selected{% endif %}>
    Competitive Exam Aspirant
    </option>

    <option value="Teacher"
    {% if user_role=="Teacher" %}selected{% endif %}>
    Teacher
    </option>

    <option value="Other"
    {% if user_role=="Other" %}selected{% endif %}>
    Other
    </option>
                </select>

            </div>

            <div class="d-flex justify-content-between">

                <a href="/dashboard"
                class="btn btn-outline-secondary">
                    Cancel
                </a>

                <input type="submit" value="Save Changes">

            </div>

        </form>

    </div>

</div>

</body>
</html>
