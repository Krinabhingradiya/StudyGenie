<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | StudyGenie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f5f7fb;
            font-family:Segoe UI,sans-serif;
        }

        .password-card{
            max-width:700px;
            margin:50px auto;
            background:#fff;
            border-radius:18px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .profile-header{
            text-align:center;
            margin-bottom:30px;
        }

        .avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#6c63ff;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            margin-bottom:15px;
            font-size:34px;
            font-weight:bold;
        }

        .btn-save{
            background:#6c63ff;
            color:white;
            border:none;
        }

        .btn-save:hover{
            background:#5648e8;
            color:white;
        }
        .password-toggle{
        border-left:0;
        background:white;
        }

        .password-toggle:hover{
            background:#f8f9fa;
        }

    </style>

</head>

<body>

<div class="container">

<div class="password-card">

<div class="profile-header">

<div class="avatar">
{{ session["user_name"][0]|upper }}
</div>

<h2>Change Password</h2>

<p class="text-muted">
Update your account password securely.
</p>

</div>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}

<div class="alert alert-{{ category }}">
{{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">

<label class="form-label">
Current Password
</label>

<div class="input-group mb-3">

<input
type="password"
name="current_password"
id="currentPassword"
class="form-control"
required>

<button
class="btn btn-outline-secondary password-toggle"
type="button"
onclick="togglePassword('currentPassword', this)">

<i class="bi bi-eye-fill"></i>

</button>

</div>
</div>

<div class="mb-3">

<label class="form-label">
New Password
</label>

<div class="input-group mb-3">

<input
type="password"
name="new_password"
id="newPassword"
class="form-control"
required>

<button
class="btn btn-outline-secondary password-toggle"
type="button"
onclick="togglePassword('newPassword', this)">

<i class="bi bi-eye-fill"></i>

</button>

</div>

</div>

<div class="mb-4">

<label class="form-label">
Confirm Password
</label>

<div class="input-group mb-4">

<input
type="password"
name="confirm_password"
id="confirmPassword"
class="form-control"
required>

<button
class="btn btn-outline-secondary password-toggle"
type="button"
onclick="togglePassword('confirmPassword', this)">

<i class="bi bi-eye-fill"></i>

</button>

</div>
</div>

<div class="d-flex justify-content-between">

<a href="/dashboard"
class="btn btn-outline-secondary">

← Back

</a>

<button
type="submit"
class="btn btn-save px-4">

Change Password

</button>

</div>

</form>

</div>

</div>
<script>

function togglePassword(id, button){

    const input = document.getElementById(id);
    const icon = button.querySelector("i");

    if(input.type==="password"){

        input.type="text";
        icon.className="bi bi-eye-slash";

    }else{

        input.type="password";
        icon.className="bi bi-eye";

    }

}

</script>
</body>
</html>
